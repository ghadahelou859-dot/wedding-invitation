<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>دعوة محمد ووعد</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background:#eee5d6;
      font-family:Arial, sans-serif;
      overflow:hidden;
    }

    /* حاوية الدعوة */

    .invitation{
      position:relative;

      width:100%;
      max-width:500px;

      height:100vh;

      margin:auto;

      overflow:hidden;

      background:#eee5d6;
    }

    /* كل صفحة */

    .page{
      position:absolute;

      top:0;
      left:0;

      width:100%;
      height:100%;

      opacity:0;
      visibility:hidden;

      transform:translateY(30px);

      transition:
        opacity .7s ease,
        transform .7s ease,
        visibility .7s;
    }

    .page.active{
      opacity:1;
      visibility:visible;
      transform:translateY(0);
      z-index:5;
    }

    /* الصور */

    .page img{
      width:100%;
      height:100%;

      object-fit:cover;

      display:block;
    }


    /* =========================
       صفحة الغلاف
    ========================== */

    #coverPage{
      cursor:pointer;
    }

    .open-area{
      position:absolute;

      left:10%;
      right:10%;

      bottom:5%;

      height:35%;

      z-index:10;

      cursor:pointer;
    }


    /* =========================
       زر الموسيقى
    ========================== */

    .music-btn{

      position:absolute;

      top:18px;
      right:18px;

      z-index:100;

      width:44px;
      height:44px;

      border-radius:50%;

      border:1px solid rgba(157,110,24,.5);

      background:rgba(250,242,227,.90);

      color:#8b6218;

      font-size:20px;

      display:none;

      align-items:center;
      justify-content:center;

      cursor:pointer;

      box-shadow:
        0 3px 12px rgba(0,0,0,.12);

      backdrop-filter:blur(5px);
    }

    .music-btn.show{
      display:flex;
    }


    /* =========================
       الأسهم
    ========================== */

    .nav-btn{

      position:absolute;

      bottom:20px;

      z-index:80;

      width:44px;
      height:44px;

      border:none;

      border-radius:50%;

      background:rgba(250,242,227,.90);

      color:#8c651f;

      font-size:25px;

      cursor:pointer;

      box-shadow:
        0 3px 12px rgba(0,0,0,.14);

      display:none;

      align-items:center;
      justify-content:center;
    }

    .nav-btn.show{
      display:flex;
    }

    #nextBtn{
      left:18px;
    }

    #prevBtn{
      right:18px;
    }


    /* =========================
       العد التنازلي الحقيقي
    ========================== */

    .countdown-live{

      position:absolute;

      top:22%;

      left:13%;
      right:13%;

      z-index:30;

      display:grid;

      grid-template-columns:repeat(4,1fr);

      gap:7px;
    }

    .time-box{

      background:#f4e7d0;

      border:1px solid #c89a42;

      min-height:92px;

      display:flex;

      flex-direction:column;

      align-items:center;
      justify-content:center;

      border-radius:12px;

      box-shadow:
        0 1px 4px rgba(90,60,20,.05);
    }

    .time-number{

      font-family:Georgia, serif;

      font-size:34px;

      color:#45300e;

      line-height:1;
    }

    .time-label{

      margin-top:8px;

      font-size:14px;

      color:#59431d;
    }


    /* =========================
       زر الموقع الحقيقي
    ========================== */

    .location-link{

      position:absolute;

      z-index:40;

      left:29%;
      right:29%;

      top:73%;

      height:7%;

      border-radius:40px;

      cursor:pointer;

      background:transparent;

      border:none;
    }


    /* نقاط الصفحات */

    .dots{

      position:absolute;

      bottom:12px;

      left:50%;

      transform:translateX(-50%);

      z-index:70;

      display:none;

      gap:7px;
    }

    .dots.show{
      display:flex;
    }

    .dot{

      width:7px;
      height:7px;

      border-radius:50%;

      background:rgba(139,98,24,.25);

      transition:.3s;
    }

    .dot.active{
      background:#9b701f;
      transform:scale(1.3);
    }


    /* شاشة صغيرة */

    @media(max-width:400px){

      .countdown-live{
        left:11%;
        right:11%;
      }

      .time-number{
        font-size:27px;
      }

      .time-label{
        font-size:12px;
      }

    }

  </style>

</head>


<body>


<div class="invitation">


  <!-- ========================
       الصفحة 1 : الغلاف
  ========================= -->

  <section
    class="page active"
    id="coverPage"
  >

    <img
      src="cover.png"
      alt="غلاف دعوة محمد ووعد"
    >

    <!-- منطقة الضغط على فتح الدعوة -->

    <button
      class="open-area"
      id="openInvitation"
      aria-label="فتح الدعوة"
    ></button>

  </section>



  <!-- ========================
       الصفحة 2 : العرس
  ========================= -->

  <section
    class="page"
    id="weddingPage"
  >

    <img
      src="wedding.png"
      alt="معلومات حفل زفاف محمد ووعد"
    >

  </section>



  <!-- ========================
       الصفحة 3 : الحنة
  ========================= -->

  <section
    class="page"
    id="hennaPage"
  >

    <img
      src="henna.png"
      alt="معلومات حنة وعد"
    >

  </section>



  <!-- ========================
       الصفحة 4 : العد التنازلي والموقع
  ========================= -->

  <section
    class="page"
    id="countdownPage"
  >

    <img
      src="countdown.png"
      alt="العد التنازلي وموقع العرس"
    >


    <!-- العد التنازلي الحقيقي -->

    <div class="countdown-live">

      <div class="time-box">

        <span
          class="time-number"
          id="days"
        >
          00
        </span>

        <span class="time-label">
          يوم
        </span>

      </div>


      <div class="time-box">

        <span
          class="time-number"
          id="hours"
        >
          00
        </span>

        <span class="time-label">
          ساعة
        </span>

      </div>


      <div class="time-box">

        <span
          class="time-number"
          id="minutes"
        >
          00
        </span>

        <span class="time-label">
          دقيقة
        </span>

      </div>


      <div class="time-box">

        <span
          class="time-number"
          id="seconds"
        >
          00
        </span>

        <span class="time-label">
          ثانية
        </span>

      </div>

    </div>


    <!-- زر الموقع -->

    <button
      class="location-link"
      id="locationBtn"
      aria-label="فتح موقع العرس"
    ></button>

  </section>



  <!-- الموسيقى -->

  <audio
    id="music"
    loop
    preload="auto"
  >

    <source
      src="music.mp3"
      type="audio/mpeg"
    >

  </audio>


  <!-- زر الموسيقى -->

  <button
    class="music-btn"
    id="musicBtn"
    aria-label="تشغيل أو إيقاف الموسيقى"
  >
    ♫
  </button>


  <!-- السابق -->

  <button
    class="nav-btn"
    id="prevBtn"
    aria-label="الصفحة السابقة"
  >
    ›
  </button>


  <!-- التالي -->

  <button
    class="nav-btn"
    id="nextBtn"
    aria-label="الصفحة التالية"
  >
    ‹
  </button>


  <!-- نقاط الصفحات -->

  <div
    class="dots"
    id="dots"
  >

    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>

  </div>


</div>



<script>


/* ==========================================
   الصفحات
========================================== */


const pages = [

  document.getElementById("coverPage"),

  document.getElementById("weddingPage"),

  document.getElementById("hennaPage"),

  document.getElementById("countdownPage")

];


let currentPage = 0;


/* ==========================================
   العناصر
========================================== */


const openInvitation =
document.getElementById("openInvitation");


const nextBtn =
document.getElementById("nextBtn");


const prevBtn =
document.getElementById("prevBtn");


const musicBtn =
document.getElementById("musicBtn");


const music =
document.getElementById("music");


const dotsContainer =
document.getElementById("dots");


const dots =
document.querySelectorAll(".dot");


/* ==========================================
   فتح الدعوة
========================================== */


openInvitation.addEventListener(
  "click",
  function(){

    /* تشغيل الموسيقى بعد ضغط المستخدم */

    music.volume = 0.55;


    music.play()
    .catch(function(){

      console.log(
        "المتصفح منع التشغيل التلقائي"
      );

    });


    musicBtn.classList.add("show");

    nextBtn.classList.add("show");

    prevBtn.classList.add("show");

    dotsContainer.classList.add("show");


    goToPage(1);

  }
);


/* ==========================================
   الانتقال بين الصفحات
========================================== */


function goToPage(index){


  if(index < 0){

    index = 0;

  }


  if(index > pages.length - 1){

    index = pages.length - 1;

  }


  pages.forEach(function(page){

    page.classList.remove("active");

  });


  pages[index].classList.add("active");


  currentPage = index;


  updateNavigation();


}


/* ==========================================
   التالي
========================================== */


nextBtn.addEventListener(
  "click",
  function(){

    if(currentPage < pages.length - 1){

      goToPage(currentPage + 1);

    }

  }
);


/* ==========================================
   السابق
========================================== */


prevBtn.addEventListener(
  "click",
  function(){

    if(currentPage > 1){

      goToPage(currentPage - 1);

    }

  }
);


/* ==========================================
   تحديث الأسهم والنقاط
========================================== */


function updateNavigation(){


  /* الصفحة الأولى بعد الغلاف = رقم 1 */


  if(currentPage === 1){

    prevBtn.style.visibility = "hidden";

  }
  else{

    prevBtn.style.visibility = "visible";

  }


  if(currentPage === pages.length - 1){

    nextBtn.style.visibility = "hidden";

  }
  else{

    nextBtn.style.visibility = "visible";

  }


  dots.forEach(function(dot){

    dot.classList.remove("active");

  });


  if(currentPage >= 1){

    const dotIndex = currentPage - 1;


    if(dots[dotIndex]){

      dots[dotIndex]
      .classList.add("active");

    }

  }

}


/* ==========================================
   الموسيقى
========================================== */


let musicPlaying = true;


musicBtn.addEventListener(
  "click",
  function(){


    if(musicPlaying){


      music.pause();


      musicBtn.textContent = "♪";


      musicPlaying = false;


    }
    else{


      music.play();


      musicBtn.textContent = "♫";


      musicPlaying = true;


    }

  }
);


/* ==========================================
   العد التنازلي
========================================== */


/*

موعد العرس:

26 أغسطس 2026
الساعة 7 مساءً

*/


const weddingDate =
new Date(
  "2026-08-26T19:00:00"
).getTime();


function updateCountdown(){


  const now =
  new Date().getTime();


  let distance =
  weddingDate - now;


  if(distance <= 0){


    document.getElementById("days")
    .textContent = "00";


    document.getElementById("hours")
    .textContent = "00";


    document.getElementById("minutes")
    .textContent = "00";


    document.getElementById("seconds")
    .textContent = "00";


    return;

  }


  const days =
  Math.floor(
    distance /
    (1000 * 60 * 60 * 24)
  );


  const hours =
  Math.floor(
    (
      distance %
      (1000 * 60 * 60 * 24)
    )
    /
    (1000 * 60 * 60)
  );


  const minutes =
  Math.floor(
    (
      distance %
      (1000 * 60 * 60)
    )
    /
    (1000 * 60)
  );


  const seconds =
  Math.floor(
    (
      distance %
      (1000 * 60)
    )
    /
    1000
  );


  document.getElementById("days")
  .textContent =
  String(days).padStart(2,"0");


  document.getElementById("hours")
  .textContent =
  String(hours).padStart(2,"0");


  document.getElementById("minutes")
  .textContent =
  String(minutes).padStart(2,"0");


  document.getElementById("seconds")
  .textContent =
  String(seconds).padStart(2,"0");

}


/* تشغيل العد مباشرة */

updateCountdown();


/* تحديث كل ثانية */

setInterval(
  updateCountdown,
  1000
);


/* ==========================================
   الموقع
========================================== */


const locationBtn =
document.getElementById(
  "locationBtn"
);


locationBtn.addEventListener(
  "click",
  function(){


    /*
    لاحقاً نحط رابط القاعة الحقيقي هنا
    */


    const mapURL =
    "https://www.google.com/maps/search/?api=1&query=Ramallah";


    window.open(
      mapURL,
      "_blank"
    );

  }
);


/* ==========================================
   السحب بالموبايل
========================================== */


let touchStartX = 0;

let touchEndX = 0;


document.addEventListener(
  "touchstart",
  function(event){

    touchStartX =
    event.changedTouches[0].screenX;

  }
);


document.addEventListener(
  "touchend",
  function(event){

    touchEndX =
    event.changedTouches[0].screenX;


    handleSwipe();

  }
);


function handleSwipe(){


  if(currentPage === 0){

    return;

  }


  const difference =
  touchEndX - touchStartX;


  if(Math.abs(difference) < 50){

    return;

  }


  if(difference < 0){

    /* سحب لليسار */

    if(currentPage < pages.length - 1){

      goToPage(
        currentPage + 1
      );

    }

  }
  else{

    /* سحب لليمين */

    if(currentPage > 1){

      goToPage(
        currentPage - 1
      );

    }

  }

}


</script>


</body>

</html>
